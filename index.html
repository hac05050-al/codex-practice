<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>初心者のためのAI勉強会</title>
    <style>
      body {
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        line-height: 1.8;
        background-color: #f9fafb;
        color: #1f2933;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #2563eb;
        color: #ffffff;
        padding: 32px 24px;
        text-align: center;
      }
      main {
        max-width: 720px;
        margin: 32px auto;
        padding: 0 24px 48px;
      }
      .event-detail {
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        padding: 32px;
      }
      .event-meta {
        display: grid;
        grid-template-columns: minmax(120px, 1fr) 2fr;
        gap: 16px 24px;
        margin-bottom: 24px;
      }
      .event-meta dt {
        font-weight: 600;
        color: #2563eb;
      }
      .event-meta dd {
        margin: 0;
      }
      .event-description {
        margin: 0;
        font-size: 1.05rem;
      }
      @media (max-width: 600px) {
        .event-detail {
          padding: 24px;
        }
        .event-meta {
          grid-template-columns: 1fr;
        }
        .event-meta dt {
          color: #1f2933;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>初心者のためのAI勉強会</h1>
      <p>AIの基礎から実践まで学べる入門向けの勉強会です</p>
    </header>
    <main>
      <section class="event-detail">
        <dl class="event-meta">
          <dt>開催日時</dt>
          <dd>2025年11月1日（土）10:00〜12:00</dd>
          <dt>場所</dt>
          <dd>会議室A</dd>
        </dl>
        <p class="event-description">
          『AIはなんとなく使っているけど、どんなことができるのかわからない。』『ChatGPTしか使ったことがなく、他のAIにも詳しくなりたい。』そんな方のために勉強会を開きます！AIの基礎知識から実際の使い方まで幅広く学びましょう！
        </p>
      </section>
    </main>
  </body>
</html>
